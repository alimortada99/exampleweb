<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Whiteboard</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#toolbar {
    position: fixed;
    top: 10px;
    left: 10px;
    background: white;
    padding: 10px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.204);
    z-index: 100;
}

.color-btn {
    width: 25px;
    height: 25px;
    border: 1px solid #444;
    border-radius: 50%;
    cursor: pointer;
    margin: 2px;
}

canvas {
    display: block;
    background: transparent;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 20;
    pointer-events: auto;
}

/* Container for uploaded images and text */
.image-wrapper, .text-wrapper {
    position: absolute;
    cursor: move;
    border: 2px dashed transparent;
    display: inline-block;
    user-select: none;
    z-index: 10;
}

.image-wrapper.selected, .text-wrapper.selected {
    border: 2px dashed #007bff;
}

.image-wrapper img {
    display: block;
    max-width: 3000px;
    pointer-events: none;
}

.editable-text {
    outline: none;
    font-family: Arial, sans-serif;
    word-break: break-word;
}

.resize-handle {
    position: absolute;
    width: 10px;
    height: 10px;
    background: #007bff;
    right: 0;
    bottom: 0;
    cursor: se-resize;
    display: none;
}

.delete-btn {
    position: absolute;
    top: -10px;
    right: -10px;
    width: 20px;
    height: 20px;
    background: red;
    color: white;
    border: none;
    border-radius: 50%;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 4px rgba(0,0,0,0.3);
}

.image-wrapper.selected .resize-handle,
.text-wrapper.selected .resize-handle {
    display: block;
}

.image-wrapper.selected .delete-btn,
.text-wrapper.selected .delete-btn {
    display: flex;
}
</style>
</head>

<body>

<div id="toolbar">
    <div>
        <button class="color-btn" style="background:black" data-color="black"></button>
        <button class="color-btn" style="background:red" data-color="red"></button>
        <button class="color-btn" style="background:blue" data-color="blue"></button>
        <button class="color-btn" style="background:green" data-color="green"></button>
        <button class="color-btn" style="background:yellow" data-color="yellow"></button>
        <button class="color-btn" style="background:purple" data-color="purple"></button>
    </div>

    <br>
    Custom:
    <input type="color" id="colorPicker" value="#000000">

    <br><br>
    Size:
    <input type="range" id="size" min="1" max="50" value="5">

    <br><br>
    <button id="penBtn" style="background: #007bff; color: white; font-weight: bold;">Pen</button>
    <button id="eraserBtn">Eraser</button>
    <button id="textBtn">Text</button>
    <button id="selectBtn">Select / Move</button>
    
    <br><br>
    Upload Image:
    <input type="file" id="imageLoader" accept="image/*">

    <br><br>
    <button id="clearBtn">Clear Canvas</button>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let strokes = [];
let currentStroke = null;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    redrawCanvas();
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let drawing = false;
let currentColor = "black";
let mode = "draw"; // "draw", "eraser", "text", or "select"

function getSize() {
    return Number(document.getElementById("size").value);
}

canvas.addEventListener("mousedown", startDraw);
canvas.addEventListener("mouseup", stopDraw);
canvas.addEventListener("mouseleave", stopDraw);
canvas.addEventListener("mousemove", draw);

function startDraw(e) {
    if (mode === "select") return;
    if (mode === "text") {
        createTextWrapper(e.clientX, e.clientY);
        updateMode("select");
        return;
    }

    drawing = true;
    if (mode === "eraser") {
        eraseAt(e.clientX, e.clientY);
    } else {
        currentStroke = {
            points: [{x: e.clientX, y: e.clientY}],
            color: currentColor,
            width: getSize()
        };
    }
}

function stopDraw() {
    if (!drawing) return;
    drawing = false;
    if (currentStroke) {
        if (currentStroke.points.length > 1) {
            strokes.push(currentStroke);
        }
        currentStroke = null;
    }
    redrawCanvas();
}

function draw(e) {
    if (!drawing || mode === "select" || mode === "text") return;

    if (mode === "eraser") {
        eraseAt(e.clientX, e.clientY);
        return;
    }

    if (currentStroke) {
        currentStroke.points.push({x: e.clientX, y: e.clientY});
        redrawCanvas();
    }
}

function eraseAt(x, y) {
    const eraseRadius = getSize() * 1.5;
    let modified = false;
    strokes = strokes.filter(stroke => {
        let hit = stroke.points.some(p => {
            let dist = Math.hypot(p.x - x, p.y - y);
            return dist < eraseRadius + stroke.width / 2;
        });
        if (hit) modified = true;
        return !hit;
    });
    if (modified) {
        redrawCanvas();
    }
}

function redrawCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    strokes.forEach(stroke => {
        if (stroke.points.length < 2) return;
        ctx.beginPath();
        ctx.lineWidth = stroke.width;
        ctx.lineCap = "round";
        ctx.strokeStyle = stroke.color;
        ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
        for (let i = 1; i < stroke.points.length; i++) {
            ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
        }
        ctx.stroke();
    });

    if (currentStroke && currentStroke.points.length > 1) {
        ctx.beginPath();
        ctx.lineWidth = currentStroke.width;
        ctx.lineCap = "round";
        ctx.strokeStyle = currentStroke.color;
        ctx.moveTo(currentStroke.points[0].x, currentStroke.points[0].y);
        for (let i = 1; i < currentStroke.points.length; i++) {
            ctx.lineTo(currentStroke.points[i].x, currentStroke.points[i].y);
        }
        ctx.stroke();
    }
}

// Selection management
function deselectAll() {
    document.querySelectorAll(".image-wrapper, .text-wrapper").forEach(el => {
        el.classList.remove("selected");
    });
}

function selectWrapper(wrapper) {
    deselectAll();
    wrapper.classList.add("selected");
}

document.addEventListener("mousedown", (e) => {
    if (!e.target.closest(".image-wrapper") && !e.target.closest(".text-wrapper") && !e.target.closest("#toolbar")) {
        deselectAll();
    }
});

// Toolbar controls & Tool switching
function updateMode(newMode) {
    mode = newMode;
    const buttons = {
        pen: document.getElementById("penBtn"),
        eraser: document.getElementById("eraserBtn"),
        text: document.getElementById("textBtn"),
        select: document.getElementById("selectBtn")
    };

    Object.values(buttons).forEach(btn => {
        btn.style.background = "#efefef";
        btn.style.color = "black";
        btn.style.fontWeight = "normal";
    });

    if (mode === "select") {
        canvas.style.pointerEvents = "none";
        buttons.select.style.background = "#007bff";
        buttons.select.style.color = "white";
        buttons.select.style.fontWeight = "bold";
    } else {
        canvas.style.pointerEvents = "auto";
        if (mode === "draw") {
            buttons.pen.style.background = "#007bff";
            buttons.pen.style.color = "white";
            buttons.pen.style.fontWeight = "bold";
        } else if (mode === "eraser") {
            buttons.eraser.style.background = "#007bff";
            buttons.eraser.style.color = "white";
            buttons.eraser.style.fontWeight = "bold";
        } else if (mode === "text") {
            buttons.text.style.background = "#007bff";
            buttons.text.style.color = "white";
            buttons.text.style.fontWeight = "bold";
        }
    }
}

document.querySelectorAll(".color-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        currentColor = btn.dataset.color;
        updateMode("draw");
    });
});

document.getElementById("colorPicker").addEventListener("input", e => {
    currentColor = e.target.value;
    updateMode("draw");
});

document.getElementById("penBtn").addEventListener("click", () => {
    updateMode("draw");
});

document.getElementById("eraserBtn").addEventListener("click", () => {
    updateMode("eraser");
});

document.getElementById("textBtn").addEventListener("click", () => {
    updateMode("text");
});

document.getElementById("selectBtn").addEventListener("click", () => {
    updateMode(mode === "select" ? "draw" : "select");
});

document.getElementById("clearBtn").addEventListener("click", () => {
    strokes = [];
    currentStroke = null;
    redrawCanvas();
});

// Text Tool Implementation
function createTextWrapper(x, y, initialText = "Type here...") {
    const wrapper = document.createElement("div");
    wrapper.className = "text-wrapper selected";
    wrapper.style.left = x + "px";
    wrapper.style.top = y + "px";

    const textEl = document.createElement("div");
    textEl.contentEditable = "true";
    textEl.className = "editable-text";
    textEl.innerHTML = initialText;
    textEl.style.minWidth = "120px";
    textEl.style.minHeight = "30px";
    textEl.style.fontSize = "20px";
    textEl.style.color = currentColor;
    textEl.style.padding = "4px";

    const resizeHandle = document.createElement("div");
    resizeHandle.className = "resize-handle";

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "delete-btn";
    deleteBtn.innerHTML = "&times;";
    deleteBtn.title = "Delete Text";
    deleteBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        wrapper.remove();
    });

    wrapper.appendChild(textEl);
    wrapper.appendChild(resizeHandle);
    wrapper.appendChild(deleteBtn);
    document.body.appendChild(wrapper);

    selectWrapper(wrapper);

    let isDragging = false;
    let startX, startY;

    wrapper.addEventListener("mousedown", (e) => {
        if (e.target === resizeHandle || e.target === deleteBtn) return;
        selectWrapper(wrapper);
        if (e.target === textEl) return; // Allow interaction inside text

        isDragging = true;
        startX = e.clientX - wrapper.offsetLeft;
        startY = e.clientY - wrapper.offsetTop;
        e.stopPropagation();
    });

    document.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        wrapper.style.left = (e.clientX - startX) + "px";
        wrapper.style.top = (e.clientY - startY) + "px";
    });

    document.addEventListener("mouseup", () => {
        isDragging = false;
    });

    let isResizing = false;
    let originalWidth, initialMouseX;

    resizeHandle.addEventListener("mousedown", (e) => {
        isResizing = true;
        initialMouseX = e.clientX;
        originalWidth = wrapper.clientWidth;
        e.stopPropagation();
    });

    document.addEventListener("mousemove", (e) => {
        if (!isResizing) return;
        const widthChange = e.clientX - initialMouseX;
        wrapper.style.width = Math.max(80, originalWidth + widthChange) + "px";
    });

    document.addEventListener("mouseup", () => {
        isResizing = false;
    });
}

// Image Upload and Manipulation
document.getElementById("imageLoader").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
            createImageWrapper(img);
        }
        img.src = event.target.result;
    }
    reader.readAsDataURL(file);
    this.value = "";
});

function createImageWrapper(img) {
    const wrapper = document.createElement("div");
    wrapper.className = "image-wrapper selected";
    wrapper.style.left = "150px";
    wrapper.style.top = "150px";

    const imageElement = document.createElement("img");
    imageElement.src = img.src;
    
    const resizeHandle = document.createElement("div");
    resizeHandle.className = "resize-handle";

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "delete-btn";
    deleteBtn.innerHTML = "&times;";
    deleteBtn.title = "Delete Image";
    deleteBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        wrapper.remove();
    });

    wrapper.appendChild(imageElement);
    wrapper.appendChild(resizeHandle);
    wrapper.appendChild(deleteBtn);
    document.body.appendChild(wrapper);

    selectWrapper(wrapper);
    updateMode("select");

    let isDragging = false;
    let startX, startY;

    wrapper.addEventListener("mousedown", (e) => {
        if (e.target === resizeHandle || e.target === deleteBtn) return;
        selectWrapper(wrapper);
        isDragging = true;
        startX = e.clientX - wrapper.offsetLeft;
        startY = e.clientY - wrapper.offsetTop;
        e.stopPropagation();
    });

    document.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        wrapper.style.left = (e.clientX - startX) + "px";
        wrapper.style.top = (e.clientY - startY) + "px";
    });

    document.addEventListener("mouseup", () => {
        isDragging = false;
    });

    let isResizing = false;
    let originalWidth, initialMouseX;

    resizeHandle.addEventListener("mousedown", (e) => {
        isResizing = true;
        initialMouseX = e.clientX;
        originalWidth = imageElement.clientWidth;
        e.stopPropagation();
    });

    document.addEventListener("mousemove", (e) => {
        if (!isResizing) return;
        const widthChange = e.clientX - initialMouseX;
        imageElement.style.width = Math.max(50, originalWidth + widthChange) + "px";
        imageElement.style.height = "auto";
    });

    document.addEventListener("mouseup", () => {
        isResizing = false;
    });
}
</script>

</body>
</html>
